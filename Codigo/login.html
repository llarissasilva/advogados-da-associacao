<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AAPC — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="navbar">
      <a class="navbar__brand" href="index.html#inicio" aria-label="Ir para o início">
        <img
          class="navbar__logo-img"
          src="assets/logo2.png"
          alt="AAPC"
          width="200"
          height="56"
          decoding="async"
        />
        <span class="navbar__tagline"
          >Associação dos Advogados da Procuradoria Jurídica da Copasa</span
        >
      </a>
      <nav class="navbar__actions" aria-label="Principal">
        <a class="navbar__link" href="index.html#inicio">INÍCIO</a>
        <a class="navbar__link" href="index.html#sobre">SOBRE</a>
        <a
          class="navbar__login navbar__login--active"
          href="login.html"
          aria-current="page"
        >
          <svg
            class="navbar__login-icon"
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          LOGIN
        </a>
      </nav>
    </header>

    <div class="page-content">
      <main class="login-main">
        <div class="login-main__inner">
          <div class="login-card">
            <h1 class="login-card__title">Acesso ao portal</h1>
            <p class="login-card__lead">
              Por favor, entre com seu e-mail e senha para acessar sua conta.
            </p>

            <form class="login-form" action="#" method="post">
              <div class="login-form__field">
                <label class="login-form__label" for="login-email">E-mail</label>
                <div class="login-form__control">
                  <span class="login-form__icon" aria-hidden="true">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path
                        d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
                      />
                      <polyline points="22,6 12,13 2,6" />
                    </svg>
                  </span>
                  <input
                    class="login-form__input"
                    type="email"
                    id="login-email"
                    name="email"
                    placeholder="E-mail"
                    autocomplete="email"
                    required
                  />
                </div>
              </div>

              <div class="login-form__field">
                <label class="login-form__label" for="login-senha">Senha</label>
                <div class="login-form__control">
                  <span class="login-form__icon" aria-hidden="true">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                      <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                  </span>
                  <input
                    class="login-form__input"
                    type="password"
                    id="login-senha"
                    name="senha"
                    placeholder="Senha"
                    autocomplete="current-password"
                    required
                  />
                </div>
              </div>

              <div class="login-form__row">
                <label class="login-form__remember">
                  <input
                    class="login-form__checkbox"
                    type="checkbox"
                    name="lembrar"
                    id="login-lembrar"
                  />
                  <span>Lembrar-me</span>
                </label>
                <a class="login-form__link" href="#">Esqueceu sua senha?</a>
              </div>

              <button class="login-form__submit" type="submit">Entrar</button>

              <p class="login-form__signup">
                Não tem uma conta?
                <a
                  class="login-form__link login-form__link--bold"
                  href="cadastro_usuario.html"
                  >Cadastre-se</a
                >
              </p>
            </form>
          </div>
        </div>
      </main>
    </div>

    <footer class="footer">
      <p class="footer__text">© 2026 AAPC - Todos os direitos reservados</p>
    </footer>
  </body>
</html>
